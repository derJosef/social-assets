name: PAF-TV – one-time recovery of existing Buffer schedule move

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/paf-tv-move-recovery.yml'
      - 'scripts/paf_tv_two_schedule_recovery.py'
      - 'tests/test_paf_tv_two_schedule_recovery.py'
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: buffer-schedule-single-flight
  cancel-in-progress: false

jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Offline regressions incl. original immutable media and dates
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile scripts/paf_tv_move_two_existing_schedules.py scripts/paf_tv_two_schedule_recovery.py
          python3 -B -m unittest discover -s tests -p 'test_paf_tv_two_schedule_recovery.py' -v
          python3 -B scripts/paf_tv_two_schedule_recovery.py --self-test

  recovery:
    name: Recover two existing schedules from verified unchanged original status
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'derJosef/social-assets' &&
      github.ref == 'refs/heads/main' &&
      github.event.issue.number == 19 &&
      github.event.issue.pull_request == null &&
      github.actor_id == 45994004 &&
      github.event.comment.user.id == 45994004 &&
      github.run_attempt == 1 &&
      github.event.comment.body == 'PAF-TV-MOVE-TWO-POSTS-RECOVER-WHOLE-VALIDATION-20261028'
    runs-on: ubuntu-slim
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Locally verify closed-scope recovery code
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_paf_tv_two_schedule_recovery.py' -v
          python3 -B scripts/paf_tv_two_schedule_recovery.py --self-test
      - name: Perform one-time exact Buffer schedule recovery with readback
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          set -euo pipefail
          python3 -u scripts/paf_tv_two_schedule_recovery.py --live
