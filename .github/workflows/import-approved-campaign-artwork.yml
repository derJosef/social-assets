name: Import approved campaign artwork
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-approved-campaign-artwork.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Fetch verified artwork and add to media
        env:
          SOURCE_URL: https://at.adobe.com/Q4lk6ej7l5rCaB9v
        run: |
          set -euo pipefail
          curl -fL --retry 2 "$SOURCE_URL" -o /tmp/artwork.png
          file /tmp/artwork.png
          install -m 644 /tmp/artwork.png media/images/2026-10-08-agentenrechte-original-logo-freigegeben.png
          sha256sum /tmp/artwork.png media/images/2026-10-08-agentenrechte-original-logo-freigegeben.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/images/2026-10-08-agentenrechte-original-logo-freigegeben.png
          git commit -m 'assets: add approved AI agent permissions campaign artwork'
          git push
