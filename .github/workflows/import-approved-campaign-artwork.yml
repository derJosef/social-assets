name: Import approved campaign artwork
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-approved-campaign-artwork.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Fetch verified artwork and add to media
        env:
          SOURCE_URL: https://at.adobe.com/Q4lk6ej7l5rCaB9v
        run: |
          set -euo pipefail
          curl -fL --retry 2 "$SOURCE_URL" -o /tmp/artwork.png
          file /tmp/artwork.png
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/artwork.png')
          assert im.size==(1122,1402), im.size
          im.convert('RGB').save('media/images/2026-10-08-agentenrechte-original-logo-freigegeben.webp', 'WEBP', quality=82, method=6)
          print('Final image:', Image.open('media/images/2026-10-08-agentenrechte-original-logo-freigegeben.webp').size)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/images/2026-10-08-agentenrechte-original-logo-freigegeben.webp
          git commit -m 'assets: add approved AI agent permissions campaign artwork'
          git push
