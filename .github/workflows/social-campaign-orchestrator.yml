name: AI Agent Builder – Recherche bis geprüfter Buffer-Entwurf

on:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - 'orchestration/briefs/*.json'
  workflow_dispatch:
    inputs:
      brief:
        description: 'orchestration/briefs/YYYY-MM-DD-slug.json'
        type: string
        required: true
      mode:
        description: 'smoke = ohne Netzwerk/Buffer, drafts = vollständiger Durchlauf'
        type: choice
        required: true
        default: smoke
        options: [smoke, drafts]

permissions:
  contents: write
  issues: read

concurrency:
  group: social-campaign-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    name: Research → QA → Original-Logo → Buffer Drafts (or safe stop)
    # Issue events run only on DEFAULT BRANCH workflow code. The public body
    # is data, never an instruction; only the confirmed owner may trigger.
    if: >-
      ${{
        github.event_name != 'issues' ||
        (github.event.action == 'opened' &&
         github.event.issue.user.login == 'derJosef' &&
         github.event.issue.author_association == 'OWNER' &&
         startsWith(github.event.issue.title, 'AIAGENT_BRIEF:'))
      }}
    # Slim: 1 vCPU / 5 GB RAM; hard GitHub limit 15 min. No Docker or privileged steps.
    runs-on: ubuntu-slim
    timeout-minutes: 14

    steps:
      - name: Repository vollständig laden
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Bild- und QA-Abhängigkeiten
        run: python3 -m pip install --disable-pip-version-check --quiet 'Pillow==12.3.0' 'numpy==2.5.4'

      - name: Offline-Regressionen (keine API-Aufrufe)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/social_orchestrator.py scripts/orchestrator_verify_buffer.py scripts/chatgpt_image_import.py
          python3 -m unittest discover -s tests -v

      - name: Genau einen Auftrag und Ausführungsmodus bestimmen
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRIEF: ${{ inputs.brief }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "issues" ]]; then
            # GitHub server-authenticated issue event; never run body as shell.
            python3 scripts/issue_brief_intake.py --event "$GITHUB_EVENT_PATH"
            BRIEF="$(python3 - "$GITHUB_EVENT_PATH" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: issue=json.load(f)['issue']
          print('orchestration/briefs/'+issue['title'].split(':',1)[1]+'.json')
          PY
          )"
            MODE="drafts"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BRIEF="$INPUT_BRIEF"
            MODE="$INPUT_MODE"
          else
            [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BEFORE_SHA" =~ ^0+$ ]] || { echo 'Unbekannter vorheriger Commit' >&2; exit 1; }
            tempfile="$(mktemp)"
            trap 'rm -f "$tempfile"' EXIT
            git diff --no-renames --diff-filter=A --name-only -z "$BEFORE_SHA" "$GITHUB_SHA" -- orchestration/briefs/ > "$tempfile"
            mapfile -d '' -t changed < "$tempfile"
            [[ "${#changed[@]}" -eq 1 ]] || { echo 'Pro Push genau eine neue Briefdatei zulässig' >&2; exit 1; }
            BRIEF="${changed[0]}"
            MODE="$(python3 - "$BRIEF" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f:
              print(json.load(f)['execution_mode'])
          PY
          )"
          fi
          [[ "$BRIEF" =~ ^orchestration/briefs/20[0-9]{2}-[0-9]{2}-[0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*\.json$ ]] || { echo 'Unsicherer Auftragsdateiname' >&2; exit 1; }
          [[ "$MODE" == smoke || "$MODE" == drafts ]] || { echo 'Unsicherer Ausführungsmodus' >&2; exit 1; }
          [[ -f "$BRIEF" ]] || { echo 'Auftrag fehlt' >&2; exit 1; }
          CAMPAIGN="$(basename "$BRIEF" .json)"
          echo "brief=$BRIEF" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "campaign=$CAMPAIGN" >> "$GITHUB_OUTPUT"
          echo "BRIEF=$BRIEF" >> "$GITHUB_ENV"
          echo "RUN_MODE=$MODE" >> "$GITHUB_ENV"
          echo "CAMPAIGN=$CAMPAIGN" >> "$GITHUB_ENV"

      - name: Protected main und geschützt schreibbaren Receipt-Ledger vor Live-Drafts prüfen
        if: steps.request.outputs.mode == 'drafts'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/production_activation_guard.py
          echo "GitHub-Schutz für main und Receipt-Branch bestätigt; keine Queue-/Publish-Freigabe." >> "$GITHUB_STEP_SUMMARY"

      - name: Kampagnen-Duplikat VOR ChatGPT-Bildimport ausschließen
        if: steps.request.outputs.mode == 'drafts'
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/campaign/$CAMPAIGN"
          existing="$(git ls-remote --heads origin "refs/heads/$branch")"
          [[ -z "$existing" ]] || { echo "Kampagnen-Branch bereits vorhanden; Bild nicht erneut importieren." >&2; exit 1; }

      - name: Vorhandenes ChatGPT-PNG über Adobe-Link sicher importieren und SHA prüfen
        if: steps.request.outputs.mode == 'drafts'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "visual-reviews/$CAMPAIGN.json" ]]; then
            echo "Vorhandener 4:5-Quellreview: kanonischer Preflight prüft SHA, Bild und Rechte."
          else
            python3 scripts/chatgpt_image_import.py --brief "$BRIEF"
            echo "ChatGPT-Bild mit Adobe-Kurzlink und SHA256 geprüft. Kein Bild-API-Aufruf." >> "$GITHUB_STEP_SUMMARY"
            echo "Josef prüft das fertige Motiv später im Buffer-Draft." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Vorbereitete ChatGPT-Texte und vorhandenes 4:5-Motiv verifizieren
        if: steps.request.outputs.mode == 'drafts'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepared_brief_preflight.py --brief "$BRIEF"

      - name: Bisherige automatische Kanaltermine read-only für die Planung laden
        if: steps.request.outputs.mode == 'drafts'
        shell: bash
        run: |
          set -euo pipefail
          # Fetching all heads also works for the *first* campaign, when no
          # automation/campaign branch exists yet.
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          python3 scripts/campaign_reservations.py

      - name: Inter-Schrift nur für die echte Bildproduktion beziehen
        if: steps.request.outputs.mode == 'drafts'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/e1d6480102fed30739fead0faee463101f892c8f/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf' -o /tmp/Inter.ttf
          echo '29160a80ff49ddcab2c97711247e08b1fab27a484a329ce8b813d820dc559031  /tmp/Inter.ttf' | sha256sum --check --status

      - name: Orchestrator ausführen (fail closed)
        id: build
        shell: bash
        env:
          # Keine kostenpflichtige Modell-API: Texte kommen aus ChatGPT prepared_content.
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ runner.temp }}/social-orchestrator-report.json
        run: |
          set -euo pipefail
          python3 scripts/social_orchestrator.py --brief "$BRIEF" --mode "$RUN_MODE" --report "$REPORT_PATH"

      - name: Geprüfte Assets auf unveränderlichem Bild-Commit sichern (NICHT main)
        if: steps.request.outputs.mode == 'drafts' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -f "visual-reviews/$CAMPAIGN.json"
          branch="automation/campaign/$CAMPAIGN"
          existing="$(git ls-remote --heads origin "refs/heads/$branch")"
          [[ -z "$existing" ]] || { echo 'Kampagnen-Output-Branch existiert bereits. Keine Wiederholung.' >&2; exit 1; }
          # First Git commit freezes the brand-verified image and its QA
          # evidence. Machine-generated raw source+review must travel WITH
          # that image to the isolated output branch; no changes to main.
          expected=3
          auto_source="media/source-images/$CAMPAIGN-source.png"
          auto_review="visual-reviews/$CAMPAIGN.json"
          if [[ -f "$auto_source" ]]; then
            [[ -f "$auto_review" ]] || { echo 'Auto-Bild hat keinen Review-Beleg.' >&2; exit 1; }
            if ! git ls-files --error-unmatch "$auto_source" >/dev/null 2>&1; then
              ! git ls-files --error-unmatch "$auto_review" >/dev/null 2>&1 || {
                echo 'Auto-Bild und Review liegen in verschiedenen Git-Zuständen.' >&2; exit 1;
              }
              git add -- "$auto_source" "$auto_review"
              expected=5
            fi
          fi
          git add -- \
            "media/source-images/$CAMPAIGN-base.png" \
            "media/images/$CAMPAIGN-branded.png" \
            "artwork-receipts/$CAMPAIGN.json"
          count="$(git diff --cached --name-only | wc -l)"
          [[ "$count" -eq "$expected" ]] || { echo "Falsche Anzahl Bild-/Review-Assets: $count statt $expected" >&2; exit 1; }
          [[ -z "$(git diff --cached --name-status | grep -v '^A[[:space:]]' || true)" ]] || exit 1
          git commit -m "assets: pin verified artwork for $CAMPAIGN"
          image_commit="$(git rev-parse HEAD)"
          python3 scripts/immutable_campaign_assets.py --campaign "$CAMPAIGN" --image-commit "$image_commit"
          python3 scripts/autonomous_campaign_gate.py --posts \
            "ready-for-buffer/auto-$CAMPAIGN-linkedin.json" \
            "ready-for-buffer/auto-$CAMPAIGN-facebook.json" \
            "ready-for-buffer/auto-$CAMPAIGN-instagram.json"
          expected_post_count=5
          if [[ "$GITHUB_EVENT_NAME" == "issues" ]]; then
            # Owner-authored brief must be auditable alongside generated media
            # on output branch; NEVER copied to protected main.
            ! git ls-files --error-unmatch "$BRIEF" >/dev/null 2>&1 || {
              echo "Issue-Brief darf nicht bereits in main sein." >&2; exit 1;
            }
            git add -- "$BRIEF"
            expected_post_count=6
          fi
          git add -- \
            "campaign-manifests/$CAMPAIGN.json" \
            "drafts/$CAMPAIGN-plan.md" \
            "ready-for-buffer/auto-$CAMPAIGN-linkedin.json" \
            "ready-for-buffer/auto-$CAMPAIGN-facebook.json" \
            "ready-for-buffer/auto-$CAMPAIGN-instagram.json"
          count="$(git diff --cached --name-only | wc -l)"
          [[ "$count" -eq "$expected_post_count" ]] || { echo "Falsche Anzahl Kampagnendateien: $count statt $expected_post_count" >&2; exit 1; }
          if git diff --cached --name-status | grep -v '^A[[:space:]]'; then
            echo 'Bestehende Dateien dürfen nicht geändert werden' >&2
            exit 1
          fi
          git commit -m "campaign: immutable media and verified draft package $CAMPAIGN"
          git push origin "HEAD:refs/heads/$branch"
          echo "$((expected + expected_post_count)) neue Kampagnendateien nur auf $branch (nicht main); Medien per Bild-Commit $image_commit fixiert." >> "$GITHUB_STEP_SUMMARY"

      - name: Vorbereitete Beiträge ohne Fremdtrigger DIREKT als Drafts senden
        if: steps.request.outputs.mode == 'drafts' && steps.build.outcome == 'success'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
        run: |
          set -euo pipefail
          test -n "$BUFFER_API_KEY" || { echo "BUFFER_API_KEY fehlt. Kampagne auf GitHub, Buffer nicht gesendet." >&2; exit 1; }
          # One Python process shares a read-only organization/channel lookup.
          # Each post still has its own reservation, independent readback and receipt.
          python3 scripts/buffer_draft.py \
            --draft "ready-for-buffer/auto-$CAMPAIGN-linkedin.json" \
            --draft "ready-for-buffer/auto-$CAMPAIGN-facebook.json" \
            --draft "ready-for-buffer/auto-$CAMPAIGN-instagram.json" \
            --send

      - name: Unabhängige Buffer-Prüfung (draft und verbindlicher Datumswert, nie Queue)
        if: steps.request.outputs.mode == 'drafts' && steps.build.outcome == 'success'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          REPORT_PATH: ${{ runner.temp }}/social-orchestrator-report.json
        run: |
          set -euo pipefail
          python3 scripts/orchestrator_verify_buffer.py --campaign "$CAMPAIGN" --report "$REPORT_PATH"

      - name: Prüfbericht als dauerhaftes GitHub-Receipt sichern
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_CAMPAIGN: ${{ steps.request.outputs.campaign }}
          REPORT_PATH: ${{ runner.temp }}/social-orchestrator-report.json
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/social-final-report
          python3 - <<'PY'
          import os,json
          from datetime import datetime,timezone
          path=os.environ["REPORT_PATH"]
          try:
              with open(path,encoding="utf-8") as f: data=json.load(f)
          except (OSError,ValueError):
              data={"steps":{},"state":"blocked_before_preparation"}
          data["github_run_id"]=os.environ["GITHUB_RUN_ID"]
          data["github_run_url"]=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          data["job_status"]=os.environ["JOB_STATUS"]
          data["receipt_at"]=datetime.now(timezone.utc).isoformat()
          cid=os.environ.get("REQUEST_CAMPAIGN","") or "preflight"
          data["campaign"]=data.get("campaign") or cid
          with open("/tmp/social-final-report/receipt.json","w",encoding="utf-8") as f:
              json.dump(data,f,ensure_ascii=False,indent=2);f.write("\n")
          print(f"Report status: {data.get('state')}, job={data['job_status']}")
          PY
          # Read-only report rendering; unverified or partial runs say BLOCKED,
          # never emit a fictitious Buffer post link or an approval claim.
          python3 scripts/social_weekly_review.py \
            --report /tmp/social-final-report/receipt.json \
            --markdown /tmp/social-final-report/review.md
          file="orchestration/reports/${REQUEST_CAMPAIGN:-preflight}-run-${GITHUB_RUN_ID}.json"
          review_file="orchestration/reports/${REQUEST_CAMPAIGN:-preflight}-run-${GITHUB_RUN_ID}.md"
          content="$(base64 -w0 /tmp/social-final-report/receipt.json)"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$file" \
            -f message="audit: orchestration run $GITHUB_RUN_ID" \
            -f content="$content" -f branch=automation-receipts > /dev/null
          markdown_content="$(base64 -w0 /tmp/social-final-report/review.md)"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$review_file" \
            -f message="review: Buffer draft snapshot run $GITHUB_RUN_ID" \
            -f content="$markdown_content" -f branch=automation-receipts > /dev/null
          echo "Prüfbericht: https://github.com/$GITHUB_REPOSITORY/blob/automation-receipts/$file" >> "$GITHUB_STEP_SUMMARY"
          echo "Wochenkampagne zur Sichtprüfung: https://github.com/$GITHUB_REPOSITORY/blob/automation-receipts/$review_file" >> "$GITHUB_STEP_SUMMARY"
          echo "Hinweis: Buffer-Links führen zunächst zum Dashboard. Post-ID ist eindeutiger Identifikator, kein erfundener Deep Link." >> "$GITHUB_STEP_SUMMARY"
          echo "Buffer-Publikation wurde durch diesen Workflow nie aktiviert." >> "$GITHUB_STEP_SUMMARY"

      - name: Zusätzliche Artefakt-Sicherung bei fehlgeschlagenem GitHub-Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-orchestrator-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/social-orchestrator-report.json
            /tmp/social-final-report/receipt.json
            /tmp/social-final-report/review.md
          if-no-files-found: warn
          retention-days: 30
