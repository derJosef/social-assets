name: Audit remaining Buffer drafts read-only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-audit-buffer-drafts.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Query draft-only posts without modifying Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from buffer_draft import buffer_graphql, GET_ORGANIZATIONS
          import os
          token=os.environ["BUFFER_API_KEY"]
          orgs=buffer_graphql(token, GET_ORGANIZATIONS, {})["account"]["organizations"]
          known={
            "6ac79c9782db5af660c65919":"instagram-smoketest-002",
            "6ac75a585d76b00cd8321775":"beispiel-linkedin",
            "6ac77566390a3385c92eda30":"image-media-smoketest-001",
            "6ac7731af9e3728044fad9bc":"auto-trigger-smoketest-001",
            "6ac77582f9e3728044fb41d9":"pdf-carousel-smoketest-001",
            "6ac79c7cd1ababbf88b1c607":"facebook-smoketest-002",
            "6ac7fa8a62435c1f1fe0e557":"linkedin-agentenrechte-approved-scheduled",
            "6ac7fa832a80dca54c7ce231":"facebook-agentenrechte-approved-scheduled",
            "6ac7fa87c121d8911406c941":"instagram-agentenrechte-approved-scheduled",
            "6ac7b25edaf7bb7cba274102":"linkedin-ki-souveraenitaet-approved-scheduled",
            "6ac7b255daf7bb7cba273f54":"facebook-ki-souveraenitaet-approved-scheduled",
            "6ac7b25ab99c473c41ba1503":"instagram-ki-souveraenitaet-approved-scheduled",
          }
          query="""query QueryDrafts($org: OrganizationId!) {
            posts(first:100,input:{organizationId:$org,filter:{status:[draft]},sort:[{field:createdAt,direction:desc}]}) {
              edges {node{id channelId status createdAt dueAt}}
              pageInfo {hasNextPage endCursor}
            }
          }"""
          total=0
          for org in orgs:
            identifier=org["id"]
            data=buffer_graphql(token,query,{"org":identifier})
            posts=data["posts"]
            print("ORGANIZATION",identifier,"DRAFT_COUNT_PAGE",len(posts["edges"]),"HAS_MORE",posts["pageInfo"]["hasNextPage"])
            for edge in posts["edges"]:
              node=edge["node"];total+=1
              print("DRAFT",node["id"],"channel="+str(node.get("channelId")),"known="+known.get(node["id"],"UNKNOWN"),"createdAt="+str(node.get("createdAt")))
            if posts["pageInfo"]["hasNextPage"]: raise RuntimeError("PAGINATION REQUIRED; STOP, NO DELETION")
          print("TOTAL_DRAFTS",total)
          print("READ_ONLY_NO_MUTATION")
          PY
