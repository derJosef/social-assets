name: Buffer – sechs Testentwürfe einmalig entfernen

on:
  push:
    branches: [main]
    paths:
      - 'cleanup-requests/delete-six-test-drafts-2026-10-08.json'

permissions:
  contents: write # Nur für einmaligen, nachvollziehbaren Löschbericht im Repository.

concurrency:
  group: buffer-drafts-single-flight
  cancel-in-progress: false

jobs:
  cleanup:
    name: Sechs dokumentierte Testentwürfe gezielt löschen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Repository abrufen
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Nur neue einmalige Anfrage zulassen und Skript syntaktisch prüfen
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          req='cleanup-requests/delete-six-test-drafts-2026-10-08.json'
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo 'Kein verlässlicher Vergleichscommit' >&2
            exit 1
          fi
          if ! git diff --no-renames --diff-filter=A --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- "$req" | grep -Fxq "$req"; then
            echo 'Keine neue genehmigte einmalige Anfrage. Abbruch.' >&2
            exit 1
          fi
          python3 -m py_compile scripts/one_time_cleanup_test_drafts.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          req = json.loads(Path("cleanup-requests/delete-six-test-drafts-2026-10-08.json").read_text())
          if req != {"operation": "delete_exact_six_test_drafts", "date": "2026-10-08", "approved_ids_count": 6}:
              raise ValueError("Falsche oder manipulierte Bereinigungsanfrage")
          print("Einmalige Bereinigungsanfrage verifiziert.")
          PY

      - name: Ausschließlich sechs verifizierte Buffer-Testentwürfe entfernen
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 -m scripts.one_time_cleanup_test_drafts
