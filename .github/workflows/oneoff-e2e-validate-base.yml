name: Oneoff - validate existing branded image against its exact base
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-e2e-validate-base.yml'
permissions:
  contents: write
jobs:
  derive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'Pillow>=11,<13' 'numpy>=2,<3'
      - shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf' -o /tmp/Inter.ttf
          export INTER_FONT=/tmp/Inter.ttf
          python scripts/social_visual_e2e_20261008.py
          mkdir -p media/source-images
          BASE='media/source-images/2026-10-09-ein-agent-drei-tests-base.png'
          OUTPUT='media/images/2026-10-09-ein-agent-drei-tests-branded-test.png'
          [[ ! -e "$BASE" ]]
          cp drafts/.visual-e2e-base.png "$BASE"
          python scripts/logo_composite.py verify "$OUTPUT" "$BASE" \
            --original media/brand/logo-pauderer-original.png \
            --heading-corner top-left --heading-box 58,138,700,365
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$BASE"
          git commit -m 'assets: preserve verifiable logo-free source for tested visual'
          git push origin HEAD:main
