name: GitHub Models API isolated read-only diagnostics

on:
  push:
    branches: [social-model-connectivity-20261010]
    paths:
      - '.github/workflows/social-model-connectivity-once.yml'
      - 'scripts/model_api_connectivity_probe.py'

permissions:
  contents: read
  models: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Four contrast-controlled GitHub API probes (no Buffer)
        env:
          GH_MODELS_PROBE_TOKEN: ${{ github.token }}
        run: python -B scripts/model_api_connectivity_probe.py
      - name: Preserve sanitized technical diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-model-readonly-connection-check
          path: /tmp/github-model-connection-diagnostic.json
          retention-days: 14
          if-no-files-found: warn
