name: Buffer – nur manuell freigegebene Veröffentlichung

# Eine neue Datei in ready-to-schedule löst NIE mehr automatisch eine Veröffentlichung aus.
on:
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Vorhandene ready-to-schedule/*.json (v2)'
        type: string
        required: true

permissions:
  contents: read
concurrency:
  group: buffer-publish-approval
  cancel-in-progress: false

jobs:
  plan:
    name: Terminanfrage ohne Buffer-Schlüssel prüfen
    runs-on: ubuntu-24.04
    outputs:
      request: ${{ steps.review.outputs.request }}
      request_sha: ${{ steps.review.outputs.request_sha }}
      draft: ${{ steps.review.outputs.draft }}
      draft_sha: ${{ steps.review.outputs.draft_sha }}
      post_id: ${{ steps.review.outputs.post_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Freigabegegenstand festhalten
        id: review
        shell: bash
        env:
          REQUEST: ${{ inputs.request_file }}
        run: |
          set -euo pipefail
          [[ "$REQUEST" =~ ^ready-to-schedule/[a-zA-Z0-9][a-zA-Z0-9_.-]{0,119}\.json$ ]] || exit 1
          python3 scripts/buffer_schedule.py --request "$REQUEST" --dry-run
          python3 - "$REQUEST" <<'PY'
          import hashlib,html,json,os,sys
          from pathlib import Path
          sys.path.insert(0,"scripts")
          from buffer_schedule import inspect_request
          info=inspect_request(sys.argv[1])
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              for name,val in [("request",info["request_file"]),("request_sha",info["request_sha256"]),
                               ("draft",info["draft_file"]),
                               ("draft_sha",hashlib.sha256(Path(info["draft_file"]).read_bytes()).hexdigest()),
                               ("post_id",info["post_id"])]:
                  if not isinstance(val,str) or any(c in val for c in "\r\n"):
                      raise ValueError("Unsicherer GitHub-Output: "+name)
                  f.write(f"{name}={val}\n")
          def show(x, limit=400):
              return html.escape(" ".join(str(x).split())[:limit], quote=True)
          draft=json.loads(Path(info["draft_file"]).read_text(encoding="utf-8"))
          image=""
          if isinstance(draft.get("media"),dict):
              imgs=draft["media"].get("images",[])
              if isinstance(imgs,list) and imgs and isinstance(imgs[0],dict):
                  image=imgs[0].get("url","")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## Veröffentlichung – unabhängige menschliche Genehmigung erforderlich\\n")
              f.write("<pre>\\n")
              for label,val in [("Plattform",info["target"]),("Buffer-Post-ID",info["post_id"]),
                                ("Geplanter UTC-Termin",info["due_at"]),
                                ("Entwurf",info["draft_file"]),("Bild-URL",image or "Kein Bild"),
                                ("Textvorschau (400 Zeichen)",info["text"][:400]),
                                ("Entwurf SHA-256",hashlib.sha256(Path(info["draft_file"]).read_bytes()).hexdigest()),
                                ("Anfrage SHA-256",info["request_sha256"])]:
                  f.write(show(label)+": "+show(val)+"\\n")
              f.write("</pre>\\n")
              f.write("**Noch NICHT in Buffer terminiert.**\\n")
          PY

  publish:
    name: Publish nur nach GitHub-Environment-Genehmigung
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: buffer-publish
    permissions:
      contents: write
      actions: read
    timeout-minutes: 10
    steps:
      - name: Vertrauenswürdigen Publisher-Commit verlangen (ohne Buffer-Token)
        shell: bash
        env:
          PINNED: ${{ vars.BUFFER_PUBLISHER_SHA }}
          APPROVERS: ${{ vars.BUFFER_APPROVER_LOGINS }}
        run: |
          set -euo pipefail
          [[ "$PINNED" =~ ^[a-f0-9]{40}$ ]] || { echo "BUFFER_PUBLISHER_SHA nicht eingerichtet" >&2; exit 1; }
          test -n "$APPROVERS" || { echo "BUFFER_APPROVER_LOGINS fehlt" >&2; exit 1; }

      - name: Vertrauenswürdigen Publisher laden (festgepinnter Commit)
        uses: actions/checkout@v5
        with:
          ref: ${{ vars.BUFFER_PUBLISHER_SHA }}
          persist-credentials: false
          path: trusted

      - name: Freigabedaten vom Main laden, niemals Skripte ausführen
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          path: data

      - name: GitHub-Environment-Approval durch unabhängigen Prüfer verifizieren
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUFFER_APPROVER_LOGINS: ${{ vars.BUFFER_APPROVER_LOGINS }}
        run: |
          set -euo pipefail
          python3 -B trusted/scripts/publish_approval.py

      - name: Genehmigten Antrag und Entwurf mit Hash erneut abgleichen
        shell: bash
        env:
          PINNED: ${{ vars.BUFFER_PUBLISHER_SHA }}
          REQUEST: ${{ needs.plan.outputs.request }}
          REQUEST_SHA: ${{ needs.plan.outputs.request_sha }}
          DRAFT: ${{ needs.plan.outputs.draft }}
          DRAFT_SHA: ${{ needs.plan.outputs.draft_sha }}
          POST_ID: ${{ needs.plan.outputs.post_id }}
        run: |
          set -euo pipefail
          [[ "$(git -C trusted rev-parse HEAD)" == "$PINNED" ]] || exit 1
          for p in "$REQUEST" "$DRAFT"; do
            [[ "$p" =~ ^(ready-to-schedule|ready-for-buffer)/[a-zA-Z0-9][a-zA-Z0-9_.-]{0,119}\.json$ ]] || exit 1
            mkdir -p "trusted/$(dirname "$p")"
            cp -- "data/$p" "trusted/$p"
          done
          [[ "$(sha256sum "trusted/$REQUEST" | cut -d' ' -f1)" == "$REQUEST_SHA" ]] || exit 1
          [[ "$(sha256sum "trusted/$DRAFT" | cut -d' ' -f1)" == "$DRAFT_SHA" ]] || exit 1
          RECEIPT="$(cd trusted && python3 - "$DRAFT" <<'PY'
          import sys
          sys.path.insert(0,"scripts")
          from buffer_draft import receipt_path
          print(receipt_path(sys.argv[1]))
          PY
          )"
          [[ "$RECEIPT" =~ ^delivery-receipts/[a-f0-9]{24}\.json$ ]] || exit 1
          mkdir -p trusted/delivery-receipts
          cp -- "data/$RECEIPT" "trusted/$RECEIPT"
          cd trusted
          python3 scripts/buffer_schedule.py --request "$REQUEST" --dry-run
          python3 - "$REQUEST" "$POST_ID" <<'PY'
          import sys
          sys.path.insert(0,"scripts")
          from buffer_schedule import inspect_request
          info=inspect_request(sys.argv[1])
          if info["post_id"] != sys.argv[2]:
              raise ValueError("Post-ID zwischen Planung und Freigabe verändert")
          PY

      - name: Bestehenden Beitrag nach deiner Genehmigung terminieren
        working-directory: trusted
        shell: bash
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_PUBLISH_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          BUFFER_APPROVER_LOGINS: ${{ vars.BUFFER_APPROVER_LOGINS }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          REQUEST: ${{ needs.plan.outputs.request }}
        run: |
          set -euo pipefail
          python3 scripts/buffer_schedule.py --request "$REQUEST" --schedule
