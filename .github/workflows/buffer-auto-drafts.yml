name: Buffer – automatische geprüfte Entwürfe

on:
  push:
    branches: [main]
    paths:
      - 'ready-for-buffer/*.json'

permissions:
  contents: write # Reservierung und Ergebnisbeleg; keine anderen GitHub-Schreibrechte.

concurrency:
  group: buffer-drafts-single-flight
  cancel-in-progress: false

jobs:
  create-drafts:
    name: Neue freigegebene Social-Media-Entwürfe übertragen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Repository und Git-Historie laden
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ausschließlich neue Freigabedateien ermitteln
        id: added
        env:
          BEFORE_SHA: ${{github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "Kein zuverlässiger Vergleichs-Commit vorhanden. Sicherer Stopp." >&2
            exit 1
          fi
          temp_file="$(mktemp)"
          trap 'rm -f "$temp_file"' EXIT
          git diff --no-renames --diff-filter=A --name-only -z "$BEFORE_SHA" "$GITHUB_SHA" -- ready-for-buffer/ > "$temp_file"
          mapfile -d '' -t added < "$temp_file"

          count=0
          for file in "${added[@]}"; do
            if [[ "$file" == ready-for-buffer/*.json && "$file" != ready-for-buffer/*/* ]]; then
              count=$((count + 1))
            fi
          done
          echo "Anzahl neuer Freigaben: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Autonomous campaign quality gate (fail closed before any Buffer writes)
        if: steps.added.outputs.count != '0'
        env:
          BEFORE_SHA: ${{github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          tempfile="$(mktemp)"
          trap 'rm -f "$tempfile"' EXIT
          git diff --no-renames --diff-filter=A --name-only -z "$BEFORE_SHA" "$GITHUB_SHA" -- ready-for-buffer/ > "$tempfile"
          mapfile -d '' -t added < "$tempfile"

          auto=()
          for file in "${added[@]}"; do
            if [[ "$file" == ready-for-buffer/auto-*.json && "$file" != ready-for-buffer/*/* ]]; then
              auto+=("$file")
            fi
          done

          if (( ${#auto[@]} > 0 )); then
            echo "Validiere alle automatisch vorbereiteten Dateien zuerst: ${#auto[@]}"
            python3 -m pip install --disable-pip-version-check --quiet 'Pillow>=11,<13' 'numpy>=2,<3'
            python3 -m unittest discover -s tests -p 'test_autonomous_campaign_gate.py' -v
            python3 scripts/autonomous_campaign_gate.py --posts "${auto[@]}"
          else
            echo "Keine autonom erstellten Kampagnen in diesem Commit."
          fi

      - name: Freigegebene Beiträge ausschließlich als Buffer-Entwürfe anlegen
        if: steps.added.outputs.count != '0'
        env:
          BEFORE_SHA: ${{github.event.before }}
          BUFFER_API_KEY: ${{secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{secrets.BUFFER_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          GITHUB_TOKEN: ${{github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp_file="$(mktemp)"
          trap 'rm -f "$temp_file"' EXIT
          git diff --no-renames --diff-filter=A --name-only -z "$BEFORE_SHA" "$GITHUB_SHA" -- ready-for-buffer/ > "$temp_file"
          mapfile -d '' -t added < "$temp_file"

          for file in "${added[@]}"; do
            if [[ "$file" == ready-for-buffer/*.json && "$file" != ready-for-buffer/*/* ]]; then
              echo "Prüfe und übertrage freigegebenen Entwurf: $file"
              python3 scripts/buffer_draft.py --draft "$file" --send
            fi
          done
