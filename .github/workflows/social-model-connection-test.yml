name: Orchestrator – Modellzugang diagnostizieren
on:
  push:
    paths:
      - '.github/workflows/social-model-connection-test.yml'
  workflow_dispatch:
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: GitHub Models API synthetischer Mini-Test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload='{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Return JSON with exactly this object: {\\\"status\\\":\\\"ok\\\"}"}],"max_tokens":80}'
          code="$(curl -sS --max-time 30 -D /tmp/headers -o /tmp/body -w '%{http_code}' \
            -X POST 'https://models.github.ai/inference/chat/completions' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload")"
          echo "HTTP=$code"
          echo "CONTENT_TYPE=$(grep -i '^content-type:' /tmp/headers | tail -1 | cut -c1-100)"
          echo "BYTES=$(wc -c < /tmp/body)"
          python3 - <<'PY'
          import json,hashlib
          b=open('/tmp/body','rb').read()
          print('BODY_SHA256',hashlib.sha256(b).hexdigest())
          if len(b)<=64:
              print('SHORT_RESPONSE_REPR',repr(b))
          try:
              j=json.loads(b)
              print('JSON_TYPE',type(j).__name__)
              if isinstance(j,dict):
                  print('HAS_CHOICES',isinstance(j.get('choices'),list))
                  print('SAFE_ERROR_TYPE',type(j.get('error')).__name__)
          except ValueError:
              print('JSON_PARSE_FAIL')
          PY
