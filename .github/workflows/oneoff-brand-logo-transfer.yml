name: One-off brand logo transfer
on:
  push:
    paths:
      - .github/workflows/oneoff-brand-logo-transfer.yml
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch original and emit resized logo bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/derJosef/social-assets/main/media/brand/logo-pauderer-original.png' -o /tmp/brand-logo.png
          echo '15dc410d1a05b96c13466ddf3052ba9cc783cdd7252b74f4fb5c3f886510dea0  /tmp/brand-logo.png' | sha256sum -c -
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          import base64,io
          im = Image.open('/tmp/brand-logo.png').convert('RGBA')
          assert im.size == (1939,1324), im.size
          width=266
          height=round(im.height*width/im.width)
          im=im.resize((width,height),Image.Resampling.LANCZOS)
          # Keep the original mark geometrically unchanged; white is the
          # backing color for transparent portions on dark social artwork.
          backing=Image.new('RGBA', im.size, 'white')
          backing.alpha_composite(im)
          out=backing.convert('RGB').quantize(colors=32,dither=Image.Dither.NONE)
          b=io.BytesIO(); out.save(b,format='PNG',optimize=True)
          d=b.getvalue()
          print('LOGO_SCALED_PX',width,height,'PNG_BYTES',len(d),flush=True)
          print('BEGIN_LOGO_BASE64',flush=True)
          s=base64.b64encode(d).decode()
          for i in range(0,len(s),1000): print(s[i:i+1000],flush=True)
          print('END_LOGO_BASE64',flush=True)
          PY