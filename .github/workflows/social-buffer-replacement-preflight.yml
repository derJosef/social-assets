name: Buffer image-only replacement - offline preflight

on:
  push:
    branches: [social-visual-45-refresh-20261010]
    paths:
      - 'ready-for-buffer/replace-2026-10-10-kundenmail-kein-befehl-005-v2-*.json'

permissions:
  contents: read

jobs:
  validate-three-drafts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet 'Pillow>=11,<13' 'numpy>=2,<3'
      - name: Check original logo and image unmodified
        shell: bash
        run: |
          set -euo pipefail
          echo '15dc410d1a05b96c13466ddf3052ba9cc783cdd7252b74f4fb5c3f886510dea0  media/brand/logo-pauderer-original.png' | sha256sum -c -
          python scripts/logo_composite.py verify \
            media/images/2026-10-10-kundenmail-pruefpunkt-portfolio-v2-logo-only.png \
            media/source-images/2026-10-10-kundenmail-pruefpunkt-portfolio-v2-base.png \
            --original media/brand/logo-pauderer-original.png
      - name: Text identity, image fingerprint, public media accessibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib, pathlib, urllib.request
          root=pathlib.Path('.')
          img='media/images/2026-10-10-kundenmail-pruefpunkt-portfolio-v2-logo-only.png'
          url='https://raw.githubusercontent.com/derJosef/social-assets/main/'+img
          receipt=json.loads(pathlib.Path('artwork-receipts/2026-10-10-kundenmail-pruefpunkt-portfolio-v2.json').read_text())
          assert hashlib.sha256(pathlib.Path(img).read_bytes()).hexdigest()==receipt['final_sha256']
          assert receipt['publication_status']=='not_scheduled_not_published'
          caption='Symbolischer technischer Datenfluss: Eingehende Kundenmail und Dokumente passieren einen sichtbaren Kontroll- und Freigabepunkt vor der CAD-Arbeitsstation. Original-Pauderer-Logo unten rechts.'
          for target in ('linkedin','facebook','instagram'):
              old=pathlib.Path(f'ready-for-buffer/auto-2026-10-10-kundenmail-kein-befehl-005-{target}.json')
              new=pathlib.Path(f'ready-for-buffer/replace-2026-10-10-kundenmail-kein-befehl-005-v2-{target}.json')
              first=json.loads(old.read_text());second=json.loads(new.read_text())
              assert first['format_version']==second['format_version']==2
              assert first['target']==second['target']==target
              assert first['text']==second['text'], f'Text changed: {target}'
              assert set(second)==set(first)=={'format_version','target','text','media'}
              assert len(second['media']['images'])==1
              assert second['media']['images'][0]=={'url':url,'alt_text':caption}
              assert first['media']!=second['media']
              print('PASS: Original text unchanged and image/alt only updated:',target)
          request=urllib.request.Request(url, method='HEAD',headers={'User-Agent':'social-assets-image-only-preflight/1.0'})
          with urllib.request.urlopen(request,timeout=25) as res:
              assert res.status==200
              assert res.headers.get('content-type','').lower().startswith('image/')
              print('PASS: Public Buffer image URL',res.status,res.headers.get('Content-Type'))
          PY
          for platform in linkedin facebook instagram; do
            python scripts/buffer_draft.py \
              --draft "ready-for-buffer/replace-2026-10-10-kundenmail-kein-befehl-005-v2-${platform}.json" --dry-run
          done
          echo 'PASS: Offline, no Buffer token, no Buffer mutation' >> "$GITHUB_STEP_SUMMARY"
