name: Reviewed 4x5 source to verified original-logo PNG (no Buffer)

on:
  push:
    branches: [social-visual-45-refresh-20261010]
    paths:
      - 'visual-reviews/2026-10-10-kundenmail-pruefpunkt-portfolio-v2.json'

permissions:
  contents: write

concurrency:
  group: reviewed-kundenmail-artwork-20261010
  cancel-in-progress: false

jobs:
  render-reviewed-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out isolated artwork PR branch
        uses: actions/checkout@v5
        with:
          ref: social-visual-45-refresh-20261010
          persist-credentials: true
          fetch-depth: 0

      - name: Python graphics tooling, no model API or Buffer API
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet 'Pillow>=11,<13' 'numpy>=2,<3'

      - name: Verify immutable original logo and campaign source
        run: |
          set -euo pipefail
          echo '15dc410d1a05b96c13466ddf3052ba9cc783cdd7252b74f4fb5c3f886510dea0  media/brand/logo-pauderer-original.png' | sha256sum -c -
          echo '626966b2022754ff953219d298fb2af226d4c6223920d118a9e96871ce208555  media/source-images/2026-10-10-kundenmail-pruefpunkt-portfolio-1080x1350.png' | sha256sum -c -

      - name: Generate exact logo-only 1080x1350 artwork, verify original logo
        shell: bash
        run: |
          set -euo pipefail
          src='media/source-images/2026-10-10-kundenmail-pruefpunkt-portfolio-v2-base.png'
          dest='media/images/2026-10-10-kundenmail-pruefpunkt-portfolio-v2-logo-only.png'
          receipt='artwork-receipts/2026-10-10-kundenmail-pruefpunkt-portfolio-v2.json'
          [[ ! -e "$src" && ! -e "$dest" && ! -e "$receipt" ]] || { echo 'Refusing any overwrite'; exit 1; }
          mkdir -p artwork-receipts
          python -B scripts/social_portfolio_scene.py \
            --spec visual-reviews/2026-10-10-kundenmail-pruefpunkt-portfolio-v2.json \
            --base "$src" \
            --final "$dest" \
            --logo media/brand/logo-pauderer-original.png | tee /tmp/social-image-render.log
          export SOURCE="$src" FINAL="$dest" RECEIPT="$receipt"
          python - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          final_data = json.loads(Path('/tmp/social-image-render.log').read_text().splitlines()[-1])
          assert final_data['layout']=='logo_only'
          assert final_data['size']==[1080,1350]
          assert final_data['logo_qa']['validator']=='personalos_canonical'
          assert final_data['logo_qa']['logo_verified'] is True
          assert final_data['source_sha256']=='626966b2022754ff953219d298fb2af226d4c6223920d118a9e96871ce208555'
          assert h(os.environ['FINAL'])==final_data['sha256']
          receipt={
            'campaign':'2026-10-10-kundenmail-kein-befehl-005',
            'artwork_id':'2026-10-10-kundenmail-pruefpunkt-portfolio-v2',
            'status':'verified_image_only_no_buffer',
            'image_path':os.environ['FINAL'],
            'base_path':os.environ['SOURCE'],
            'source_path':'media/source-images/2026-10-10-kundenmail-pruefpunkt-portfolio-1080x1350.png',
            'source_sha256':final_data['source_sha256'],
            'final_sha256':final_data['sha256'],
            'logo_only':True,
            'image_size':[1080,1350],
            'logo_verification':'personalos_canonical_verify_0',
            'manual_source_review':'visual-reviews/2026-10-10-kundenmail-pruefpunkt-portfolio-v2.json',
            'publication_status':'not_scheduled_not_published'
          }
          Path(os.environ['RECEIPT']).write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Final image fingerprint:',final_data['sha256'])
          PY

      - name: Commit only three audited new image files to branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            media/source-images/2026-10-10-kundenmail-pruefpunkt-portfolio-v2-base.png \
            media/images/2026-10-10-kundenmail-pruefpunkt-portfolio-v2-logo-only.png \
            artwork-receipts/2026-10-10-kundenmail-pruefpunkt-portfolio-v2.json
          [[ "$(git diff --cached --name-only | wc -l)" -eq 3 ]] || exit 1
          git commit -m 'assets: verified logo-only 4x5 customer-mail portfolio scene'
          git push origin HEAD:social-visual-45-refresh-20261010
          echo 'PASS: Exact original-logo 4:5 image generated and committed to PR branch. No Buffer action.' >> "$GITHUB_STEP_SUMMARY"
