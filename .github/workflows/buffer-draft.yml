name: Buffer – LinkedIn-Entwurf

on:
  # Dispatch from a trusted, numbered control issue because the connected
  # GitHub app exposes issue comments but not workflow_dispatch.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      draft_file:
        description: "JSON-Datei unter drafts/ oder ready-for-buffer/ (LinkedIn, Facebook, Instagram)"
        required: true
        type: string
        default: "drafts/beispiel-linkedin.json"
      send_to_buffer:
        description: "An Buffer als Entwurf senden? (Standard: NEIN)"
        required: true
        type: boolean
        default: false
      check_connection:
        description: "Nur API-Verbindung und LinkedIn-Kanal prüfen? (KEIN Entwurf)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write # Ausschließlich für die GitHub-Empfangsbelege erforderlich.
  pull-requests: read # Only for protected brief-approval PR provenance.

concurrency:
  group: buffer-drafts-single-flight
  cancel-in-progress: false

jobs:
  draft:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Nur Entwurf, keine Veröffentlichung
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dateien abrufen
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Python-Version anzeigen
        run: python3 --version

      - name: Python 3.12 fuer reproduzierbare Personenbild-Pruefung
        if: inputs.send_to_buffer == true
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Bildpruefung fuer freigegebene automatische Kampagnen vorbereiten
        if: inputs.send_to_buffer == true
        run: python3 -m pip install --disable-pip-version-check --quiet 'Pillow==12.3.0' 'numpy==2.5.4'

      - name: Exakte Inter-Medium-Schrift fuer automatische Personenbilder
        if: inputs.send_to_buffer == true && startsWith(inputs.draft_file, 'ready-for-buffer/auto-')
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/e1d6480102fed30739fead0faee463101f892c8f/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf' -o /tmp/Inter.ttf
          echo '29160a80ff49ddcab2c97711247e08b1fab27a484a329ce8b813d820dc559031  /tmp/Inter.ttf' | sha256sum --check --status

      - name: JSON prüfen und optional Buffer-Entwurf erstellen
        env:
          DRAFT_FILE: ${{ inputs.draft_file }}
          SEND_TO_BUFFER: ${{ inputs.send_to_buffer }}
          CHECK_CONNECTION: ${{ inputs.check_connection }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          BUFFER_BRAND: ai-agent-builder
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CHECK_CONNECTION" == "true" && "$SEND_TO_BUFFER" == "true" ]]; then
            echo "Verbindungstest und Senden können nicht gleichzeitig ausgewählt werden." >&2
            exit 1
          elif [[ "$CHECK_CONNECTION" == "true" ]]; then
            python3 scripts/buffer_draft.py --draft "$DRAFT_FILE" --check-connection
          elif [[ "$SEND_TO_BUFFER" == "true" ]]; then
            python3 scripts/buffer_draft.py --draft "$DRAFT_FILE" --send
          else
            python3 scripts/buffer_draft.py --draft "$DRAFT_FILE" --dry-run
          fi

  picturefix-preview:
    # Exactly issue #64, created by the designated GitHub agents identity.
    # No workflow_dispatch parameters, user-selected ref, generic path, dueAt,
    # queue or publishing interface. Code is checked out from protected main.
    if: >-
      ${{
        github.event_name == 'issue_comment' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'derJosef-agents' &&
        github.event.comment.user.login == 'derJosef-agents' &&
        github.event.issue.number == 64 &&
        !github.event.issue.pull_request &&
        github.event.issue.user.login == 'derJosef-agents' &&
        github.event.issue.title == 'PICTUREFIX BUFFER DRAFT CONTROL' &&
        (
          github.event.comment.body == 'PF01_FACEBOOK_DRAFT_ONLY' ||
          github.event.comment.body == 'PF01_INSTAGRAM_DRAFT_ONLY' ||
          github.event.comment.body == 'PF01_PINTEREST_DRAFT_ONLY'
        )
      }}
    name: PictureFix PF-01 – only unpublished draft + image readback
    runs-on: ubuntu-slim
    timeout-minutes: 6
    steps:
      - name: Verified Buffer integration from protected main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify real PictureFix PNG structure
        run: python3 -m pip install --disable-pip-version-check --quiet 'Pillow==12.3.0'

      - name: Send exactly one approved PF-01 image-bearing draft
        shell: bash
        env:
          BUFFER_BRAND: picturefix
          BUFFER_API_KEY: ${{ secrets.BUFFER_PICTUREFIX_API_KEY }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_PICTUREFIX_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_PICTUREFIX_INSTAGRAM_CHANNEL_ID }}
          BUFFER_PINTEREST_CHANNEL_ID: ${{ secrets.BUFFER_PICTUREFIX_PINTEREST_CHANNEL_ID }}
          BUFFER_PICTUREFIX_PINTEREST_BOARD_SERVICE_ID: ${{ secrets.BUFFER_PICTUREFIX_PINTEREST_BOARD_SERVICE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          TRIGGER: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          # The trigger is an exact allowlist value, never executed as code.
          case "$TRIGGER" in
            PF01_FACEBOOK_DRAFT_ONLY) draft="drafts/picturefix-pf01-facebook.json" ;;
            PF01_INSTAGRAM_DRAFT_ONLY) draft="drafts/picturefix-pf01-instagram.json" ;;
            PF01_PINTEREST_DRAFT_ONLY) draft="drafts/picturefix-pf01-pinterest.json" ;;
            *) echo "Disallowed PictureFix trigger" >&2; exit 1 ;;
          esac
          test -n "$BUFFER_API_KEY" || { echo "Dedicated PictureFix API key not configured" >&2; exit 1; }
          # No implicit fall back to the AI-Agent-Builder Buffer credentials.
          # Brand ownership and exact three social handles are verified live
          # by the adapter using the dedicated token; configured IDs, if any,
          # must still match. Multiple Pinterest boards require a selected ID.
          python3 scripts/buffer_draft.py --draft "$draft" --send

  picturefix-preflight:
    # Read-only inspection of the separate PictureFix Buffer account, without
    # any image, draft, receipt, queue, schedule, or publication mutation.
    if: >-
      ${{
        github.event_name == 'issue_comment' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'derJosef-agents' &&
        github.event.comment.user.login == 'derJosef-agents' &&
        github.event.issue.number == 64 &&
        !github.event.issue.pull_request &&
        github.event.issue.user.login == 'derJosef-agents' &&
        github.event.issue.title == 'PICTUREFIX BUFFER DRAFT CONTROL' &&
        github.event.comment.body == 'PF01_PREFLIGHT_ONLY'
      }}
    permissions:
      contents: read
    name: PictureFix PF-01 – isolated read-only API/channel/board preflight
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout vetted adapter on main without stored credentials
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate PictureFix account and three channels without writes
        shell: bash
        env:
          BUFFER_BRAND: picturefix
          BUFFER_API_KEY: ${{ secrets.BUFFER_PICTUREFIX_API_KEY }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_PICTUREFIX_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_PICTUREFIX_INSTAGRAM_CHANNEL_ID }}
          BUFFER_PINTEREST_CHANNEL_ID: ${{ secrets.BUFFER_PICTUREFIX_PINTEREST_CHANNEL_ID }}
          BUFFER_PICTUREFIX_PINTEREST_BOARD_SERVICE_ID: ${{ secrets.BUFFER_PICTUREFIX_PINTEREST_BOARD_SERVICE_ID }}
        run: |
          set -euo pipefail
          python3 scripts/buffer_draft.py --check-picturefix-connection
