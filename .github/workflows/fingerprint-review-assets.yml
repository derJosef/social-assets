name: Fingerabdruck-Serie – isolierte Grafik-QA (kein Buffer)

on:
  push:
    branches:
      - feat/fingerabdruck-selfies-20261021
    paths:
      - '.github/workflows/fingerprint-review-assets.yml'
      - 'scripts/fingerprint_campaign_once.py'

permissions:
  contents: write

jobs:
  prepare-raw-images:
    if: github.ref == 'refs/heads/feat/fingerabdruck-selfies-20261021'
    runs-on: ubuntu-slim
    timeout-minutes: 25
    steps:
      - name: Eingeschraenkten Bild-Branch auschecken
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Abhaengigkeiten exakt installieren
        run: python -m pip install --disable-pip-version-check --quiet 'Pillow==12.3.0' 'numpy==2.5.4'
      - name: Inter-Font mit SHA-256 pruefen
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/e1d6480102fed30739fead0faee463101f892c8f/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf' -o /tmp/Inter.ttf
          echo '29160a80ff49ddcab2c97711247e08b1fab27a484a329ce8b813d820dc559031  /tmp/Inter.ttf' | sha256sum --check --status
      - name: Kontrolliert 3 Bilder mit Original-Logo erzeugen und pruefen
        run: |
          set -euo pipefail
          python -m py_compile scripts/fingerprint_campaign_once.py scripts/logo_composite.py scripts/social_portfolio_scene.py
          python scripts/fingerprint_campaign_once.py > /tmp/fingerprint-build-receipts.json
          python - <<'PY'
          import json
          from pathlib import Path
          values=json.loads(Path('/tmp/fingerprint-build-receipts.json').read_text())
          assert len(values)==3, f'Not exactly 3 images: {len(values)}'
          assert all(v['logo_qa']['logo_verified'] and v['size']==[1080,1350] for v in values)
          print('THREE_IMAGE_SMOKE_TEST_PASS')
          PY
      - name: Nur validierte neue Assets auf den isolierten Branch uebernehmen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'media/source-images/2026-10-21-fingerabdruck-selfie-*-source.png' 'media/source-images/2026-10-21-fingerabdruck-selfie-*-base.png' 'media/images/2026-10-21-fingerabdruck-selfie-*.png' 'visual-reviews/2026-10-21-fingerabdruck-selfie-*.json'
          git diff --cached --name-only
          git diff --cached --quiet && { echo 'Keine neuen Assets'; exit 1; }
          git commit -m 'assets: 3 logo-verifizierte Fingerabdruck-Motive (nur Draft)'
          git push origin HEAD:feat/fingerabdruck-selfies-20261021
